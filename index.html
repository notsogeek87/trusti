<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F3A5F" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pas de Referer vers les hôtes d'images : Google (play-lh) renvoie 429 pour le Referer https://localhost/ de l'APK Capacitor -->
    <meta name="referrer" content="no-referrer" />
    <title>Trusti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Vercel Web Analytics (sans cookie) : site web uniquement, pas dans l'APK Capacitor ni en local -->
    <script>
      (function () {
        var h = location.hostname;
        var native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        if (native || h === 'localhost' || h === '127.0.0.1') return;
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        var s = document.createElement('script');
        s.defer = true;
        s.src = '/_vercel/insights/script.js';
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body style="overflow-x: hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
