name: Web CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund --loglevel=error

      - name: Vérifier la syntaxe des fonctions serverless (api/, server/)
        run: |
          set -e
          for f in $(find api server -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done

      - name: Build (Vite)
        run: npm run build
