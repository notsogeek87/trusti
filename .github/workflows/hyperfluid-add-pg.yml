name: Hyperfluid add pg

# À lancer à la main (Actions > Run workflow) sur la branche hyperfluid :
# installe le driver pg, met à jour package.json et package-lock.json,
# puis commit sur la branche. Supprimable une fois fait.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer pg
        run: npm install pg --no-audit --no-fund --loglevel=error

      - name: Vérifier que le lock est cohérent
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Commit sur la branche
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(hyperfluid): ajouter pg (driver Postgres classique)"
          git push
