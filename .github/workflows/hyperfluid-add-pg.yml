name: Hyperfluid add pg

# Se lance tout seul quand ce fichier est poussé sur la branche hyperfluid
# (un workflow_dispatch n'apparaît que s'il est sur la branche par défaut).
# Installe le driver pg, met à jour package.json et package-lock.json, puis
# commit sur la branche. Sans effet si pg est déjà installé. Supprimable ensuite.
on:
  push:
    branches: [hyperfluid]
    paths:
      - ".github/workflows/hyperfluid-add-pg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer pg
        run: |
          if grep -q '"pg":' package.json; then
            echo "pg déjà installé, rien à faire"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          npm install pg --no-audit --no-fund --loglevel=error

      - name: Vérifier que le lock est cohérent
        if: env.SKIP != '1'
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Commit sur la branche
        if: env.SKIP != '1'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(hyperfluid): ajouter pg (driver Postgres classique)"
          git push
