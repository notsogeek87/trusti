name: Hyperfluid image

# À chaque push sur la branche hyperfluid : tests, construction de l'image,
# publication sur ghcr.io, puis création automatique du tag hyperfluid-v1.0.N.
# Hyperfluid suit ces tags (voir hyperfluid.toml) et redéploie tout seul.
# Un tag hyperfluid-vX.Y.Z poussé à la main reste possible : il construit aussi.
on:
  push:
    branches: [hyperfluid]
    paths-ignore:
      - ".github/workflows/hyperfluid-add-pg.yml"
      - ".github/workflows/hyperfluid-import-db.yml"
      - "**.md"
    tags:
      - "hyperfluid-v*"

concurrency:
  group: hyperfluid-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund --loglevel=error

      - name: Tests unitaires
        run: npm test

      - name: Déterminer la version
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#hyperfluid-v}"
            echo "NEW_TAG=" >> "$GITHUB_ENV"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            echo "NEW_TAG=hyperfluid-v${VERSION}" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Construire l'image
        run: docker build -t "ghcr.io/notsogeek87/trusti:${VERSION}" .

      - name: Publier sur ghcr.io
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/notsogeek87/trusti:${VERSION}"

      - name: Créer le tag (une fois l'image publiée)
        if: env.NEW_TAG != ''
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"
