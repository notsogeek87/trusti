name: Hyperfluid image

# Construit l'image Docker de Trusti et la publie sur ghcr.io quand on pousse
# un tag hyperfluid-vX.Y.Z. Hyperfluid suit ces tags (voir hyperfluid.toml).
on:
  push:
    tags:
      - "hyperfluid-v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund --loglevel=error

      - name: Tests unitaires
        run: npm test

      - name: Construire l'image
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#hyperfluid-v}"
          docker build -t "ghcr.io/notsogeek87/trusti:${VERSION}" .
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publier sur ghcr.io
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/notsogeek87/trusti:${VERSION}"
