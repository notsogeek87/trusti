name: Play Store status

# Lecture seule : affiche les canaux Google Play de Trusti et le statut de
# leurs releases (draft / inProgress / completed), sans rien modifier.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-api-python-client google-auth
      - name: Liste les canaux
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/play_store_status.py --package eu.trusti.app
