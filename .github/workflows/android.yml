name: Android APK

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lu par android/app/build.gradle : versionCode = BUILD_NUMBER, versionName = <appVersionBase>.<BUILD_NUMBER>.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci --no-audit --no-fund --loglevel=error

      - run: npm run cap:sync

      # versionCode (BUILD_NUMBER) et tag de release croissent à chaque run. Le tag DOIT être
      # <appVersionBase>.<run_number> (ex. v1.0.152) : un tag « v1.0-25 » serait lu comme une
      # pré-version inférieure à 1.0 et plus aucune mise à jour ne serait proposée.
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep '^appVersionBase=' android/gradle.properties | cut -d= -f2)
          echo "code=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=${BASE}.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon -q

      # Gradle nomme toujours sa sortie "app-debug.apk" (nom fixe lié au
      # buildType), quelle que soit la version : on la renomme pour que le
      # fichier téléchargé (artifact ou asset de release) porte la version
      # au lieu d'un nom générique identique à chaque run.
      - name: Renommer l'APK avec sa version
        id: apk
        run: |
          NAME="Trusti-${{ steps.version.outputs.name }}.apk"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/$NAME"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: trusti-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      # Vraie release GitHub, versionnée et permanente : seulement pour main,
      # jamais écrasée (chaque run a une version unique), pas marquée
      # "Pre-release". Toujours signée avec la clé debug committée (pas de
      # clé de production configurée) : à faire évoluer le jour où on distribue
      # via le Play Store ou en dehors des testeurs internes.
      - name: Publier la release GitHub (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<EOF
          ## Trusti ${{ steps.version.outputs.name }}

          Run #${{ github.run_number }} (${{ github.sha }}). Signé avec la clé debug (pas de clé de production configurée).

          ### Installer

          - **Trusti est déjà installé** : ouvrez l'app. Elle détecte cette version à l'ouverture et propose la mise à jour :
            1. Touchez « Installer » : la mise à jour se télécharge.
            2. Si Android demande d'autoriser Trusti à installer des applications, activez l'option, puis revenez en arrière.
            3. Confirmez avec « Mettre à jour ». Vos données sont conservées.
            Vous pouvez aussi lancer la recherche à la main : écran Paramètres (« Espace de stockage ») > « Rechercher une mise à jour ».
          - **Première installation** (manuelle) : téléchargez l'APK ci-dessous (\`${{ steps.apk.outputs.name }}\`), ouvrez-le, autorisez la source si Android la bloque (« Autoriser depuis cette source »), puis touchez « Installer ».
          EOF
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Trusti $TAG" \
            --notes-file release-notes.md \
            --latest \
            --target "${{ github.sha }}"

      # Les artifacts d'Actions sont hébergés sur Azure Blob Storage, souvent
      # bloqué par des politiques réseau restrictives. Une release GitHub
      # (objects.githubusercontent.com) reste accessible dans ces cas et sert
      # de lien stable pour installer le dernier APK debug. Un tag par branche
      # évite qu'un build staging n'écrase le dernier build main (ou l'inverse).
      # Réservé à staging/PR/dispatch : main a sa vraie release ci-dessus.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK debug en release GitHub
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Trusti — APK debug (${{ steps.reltag.outputs.branch }})" \
            --notes "Build automatique non signé, run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
