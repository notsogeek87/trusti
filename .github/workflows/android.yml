name: Android APK

on:
  push:
    branches: [main, staging]
    # La page publique des retours testeurs n'est pas dans l'app : inutile de reconstruire l'APK.
    paths-ignore:
      - 'public/retours.html'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lu par android/app/build.gradle : versionCode = BUILD_NUMBER, versionName = <appVersionBase>.<BUILD_NUMBER>.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci --no-audit --no-fund --loglevel=error

      - name: Logo Hyperfluid (mention d'hébergement)
        run: sh scripts/fetch-hosting-logo.sh

      - run: npm run cap:sync
        env:
          # Mention « Hébergé en France par Hyperfluid » : l'API de l'app est chez Hyperfluid.
          VITE_HOSTED_BY: hyperfluid

      # versionCode (BUILD_NUMBER) et tag de release croissent à chaque run. Le tag DOIT être
      # <appVersionBase>.<run_number> (ex. v1.0.152) : un tag « v1.0-25 » serait lu comme une
      # pré-version inférieure à 1.0 et plus aucune mise à jour ne serait proposée.
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep '^appVersionBase=' android/gradle.properties | cut -d= -f2)
          echo "code=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=${BASE}.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: github.event_name != 'push' || github.ref_name != 'main'
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon -q

      - name: Construire et vérifier l’APK de publication
        id: signature
        if: github.event_name == 'push' && github.ref_name == 'main'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.TRUSTI_APK_KEYSTORE_BASE64 }}
          TRUSTI_APK_KEYSTORE_PASSWORD: ${{ secrets.TRUSTI_APK_KEYSTORE_PASSWORD }}
          TRUSTI_APK_KEY_ALIAS: ${{ secrets.TRUSTI_APK_KEY_ALIAS }}
          TRUSTI_APK_KEY_PASSWORD: ${{ secrets.TRUSTI_APK_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.TRUSTI_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Secret TRUSTI_APK_KEYSTORE_BASE64 manquant}"
          : "${TRUSTI_APK_KEYSTORE_PASSWORD:?Secret TRUSTI_APK_KEYSTORE_PASSWORD manquant}"
          : "${TRUSTI_APK_KEY_ALIAS:?Secret TRUSTI_APK_KEY_ALIAS manquant}"
          : "${TRUSTI_APK_KEY_PASSWORD:?Secret TRUSTI_APK_KEY_PASSWORD manquant}"
          : "${EXPECTED_SHA256:?Variable TRUSTI_APK_CERT_SHA256 manquante}"
          umask 077
          export TRUSTI_APK_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/trusti-github.XXXXXX")"
          trap 'rm -f "$TRUSTI_APK_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TRUSTI_APK_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          ./gradlew assembleGithubRelease --no-daemon -q

          shopt -s nullglob
          apks=(app/build/outputs/apk/githubRelease/*.apk)
          if [[ "${#apks[@]}" != 1 ]]; then
            echo "::error::Un seul APK GitHub est attendu"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "${apks[0]}")
          actual=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          expected=$(tr -d ':' <<< "$EXPECTED_SHA256")
          if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ||
                "${actual,,}" != "${expected,,}" ||
                "${actual,,}" == 8f2fe2d4f47476e30c454d21fd61dd7c32e22c94777d7a14eff8226316f0f3ff ]]; then
            echo "::error::Le certificat de l’APK ne correspond pas à la clé de publication"
            exit 1
          fi
          echo "sha256=${actual,,}" >> "$GITHUB_OUTPUT"
          mv "${apks[0]}" app/build/outputs/apk/app-published.apk

      - name: Renommer l’APK avec sa version
        id: apk
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          NAME="Trusti-${{ steps.version.outputs.name }}.apk"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            SRC="android/app/build/outputs/apk/app-published.apk"
          fi
          DEST="android/app/build/outputs/apk/$NAME"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: trusti-${{ github.event_name == 'push' && github.ref_name == 'main' && 'apk' || 'debug' }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publier la release GitHub (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<EOF
          ## Trusti ${{ steps.version.outputs.name }}

          Run #${{ github.run_number }} (${{ github.sha }}). Signé avec la clé de publication GitHub de Trusti.

          Empreinte SHA-256 du certificat : ${{ steps.signature.outputs.sha256 }}.

          ### Installer

          - **Vous utilisez un ancien APK GitHub signé avec la clé debug** : dans Trusti, ouvrez Paramètres → Espace de stockage → Exporter / importer mes données. Exportez vos données et conservez le fichier hors de l’application. Désinstallez Trusti, installez l’APK ci-dessous puis importez votre sauvegarde.
          - **Vous utilisez déjà un APK GitHub signé avec la clé de publication** : ouvrez l'app. Elle détecte cette version à l'ouverture et propose la mise à jour :
            1. Touchez « Installer » : la mise à jour se télécharge.
            2. Si Android demande d'autoriser Trusti à installer des applications, activez l'option, puis revenez en arrière.
            3. Confirmez avec « Mettre à jour ». Vos données sont conservées.
            Vous pouvez aussi lancer la recherche à la main : écran Paramètres (« Espace de stockage ») > « Rechercher une mise à jour ».
          - **Première installation** (manuelle) : téléchargez l'APK ci-dessous (\`${{ steps.apk.outputs.name }}\`), ouvrez-le, autorisez la source si Android la bloque (« Autoriser depuis cette source »), puis touchez « Installer ».
          EOF
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Trusti $TAG" \
            --notes-file release-notes.md \
            --latest \
            --target "${{ github.sha }}"

      # Les artifacts d'Actions sont hébergés sur Azure Blob Storage, souvent
      # bloqué par des politiques réseau restrictives. Une release GitHub
      # (objects.githubusercontent.com) reste accessible dans ces cas et sert
      # de lien stable pour installer le dernier APK debug. Un tag par branche
      # évite qu'un build staging n'écrase le dernier build main (ou l'inverse).
      # Réservé à staging/PR/dispatch : main a sa vraie release ci-dessus.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK debug en release GitHub
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "Trusti — APK debug (${{ steps.reltag.outputs.branch }})" \
            --notes "Build de test signé avec la clé debug, run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
