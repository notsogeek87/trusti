<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Affiche Trusti-Score</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: #E9F0F6; font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; color: #1B2A3A; }
  .board { position: absolute; left: 50px; top: 60px; width: 980px; height: 720px; background: #1a1a1a; border: 22px solid #8B4513; border-radius: 24px; padding: 50px 60px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  h1 { color: #fff; font-size: 84px; line-height: 1.1; font-weight: 800; }
  .grades { display: flex; justify-content: space-between; margin-top: 70px; }
  .g { text-align: center; width: 160px; }
  .g b { display: block; font-size: 190px; line-height: 1; font-weight: 900; }
  .g span { display: block; margin-top: 14px; color: #ddd; font-size: 30px; }
  .info { position: absolute; left: 50px; top: 830px; width: 980px; background: #fff; border: 3px solid #1F3A5F; border-radius: 24px; padding: 40px 50px; }
  .info h2 { font-size: 44px; color: #1F3A5F; margin-bottom: 14px; }
  .info p { font-size: 32px; line-height: 1.4; }
  .cta { position: absolute; left: 50px; top: 1150px; width: 980px; background: #1F3A5F; border-radius: 24px; padding: 40px 50px; color: #fff; }
  .cta h2 { font-size: 46px; margin-bottom: 12px; }
  .cta p { font-size: 40px; color: #9CC4EA; font-weight: 700; }
</style>
</head>
<body>
  <div class="board">
    <h1>La confiance<br>ne se devine pas,<br>elle se note.</h1>
    <div class="grades">
      <div class="g"><b style="color:#2E9E5B">A</b><span>Excellent</span></div>
      <div class="g"><b style="color:#8dc63f">B</b><span>Bon</span></div>
      <div class="g"><b style="color:#fbb03b">C</b><span>Moyen</span></div>
      <div class="g"><b style="color:#f7931e">D</b><span>Risqué</span></div>
      <div class="g"><b style="color:#e5484d">E</b><span>Critique</span></div>
    </div>
  </div>
  <div class="info">
    <h2>Évaluez la souveraineté numérique de vos applications</h2>
    <p>Une note de A à E : localisation des données, gouvernance, contrôle technique, RGPD, transparence.</p>
  </div>
  <div class="cta">
    <h2>Découvrez Trusti-Score</h2>
    <p>trusti.lielu.eu</p>
  </div>
</body>
</html>
