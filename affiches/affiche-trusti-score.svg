<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- ============================================================ -->
  <!-- AFFICHE TRUSTI-SCORE - Concept : "La confiance ne se devine pas, elle se note." -->
  <!-- ============================================================ -->
  
  <defs>
    <!-- ======================================================== -->
    <!-- POLICES -->
    <!-- ======================================================== -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
      
      .nunito { font-family: 'Nunito', sans-serif; }
      .nunito-bold { font-family: 'Nunito', sans-serif; font-weight: 800; }
      .nunito-black { font-family: 'Nunito', sans-serif; font-weight: 900; }
    </style>
    
    <!-- ======================================================== -->
    <!-- COULEURS -->
    <!-- ======================================================== -->
    <color id="nuit" rgb="31, 58, 95"/>      <!-- #1F3A5F - Bleu nuit -->
    <color id="azur" rgb="59, 130, 196"/>     <!-- #3B82C4 - Bleu azur -->
    <color id="ciel" rgb="233, 240, 246"/>    <!-- #E9F0F6 - Fond clair -->
    <color id="ink" rgb="27, 42, 58"/>       <!-- #1B2A3A - Encre -->
    <color id="blanc" rgb="255, 255, 255"/>
    <color id="noir" rgb="0, 0, 0"/>
    
    <!-- Couleurs des notes -->
    <color id="gradeA" rgb="0, 104, 55"/>    <!-- #006837 -->
    <color id="gradeB" rgb="141, 198, 63"/>   <!-- #8dc63f -->
    <color id="gradeC" rgb="251, 176, 59"/>   <!-- #fbb03b -->
    <color id="gradeD" rgb="247, 147, 30"/>   <!-- #f7931e -->
    <color id="gradeE" rgb="193, 39, 45"/>   <!-- #c1272d -->
    
    <!-- ======================================================== -->
    <!-- TEXTURES ET MOTIFS -->
    <!-- ======================================================== -->
    
    <!-- Texture tableau noir (ardoise) -->
    <pattern id="tableauNoir" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#1a1a1a"/>
      <path d="M0 0L40 40M40 0L0 40" stroke="#333" stroke-width="1" opacity="0.3"/>
    </pattern>
    
    <!-- Texture papier vieilli pour le fond -->
    <filter id="papierVieilli" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95
                                          0 0 0 0 0.92
                                          0 0 0 0 0.88
                                          0 0 0 0.1 0" result="aged"/>
      <feComposite in="SourceGraphic" in2="aged" operator="over"/>
    </filter>
    
    <!-- Ombre portée pour les éléments -->
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="8" flood-color="#1F3A5F" flood-opacity="0.3"/>
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#1F3A5F" flood-opacity="0.2"/>
    </filter>
    
    <!-- Ombre pour les craies -->
    <filter id="ombreCraie" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#333" flood-opacity="0.4"/>
    </filter>
    
    <!-- ======================================================== -->
    <!-- MASQUES -->
    <!-- ======================================================== -->
    <mask id="masqueTableau">
      <rect x="50" y="50" width="980" height="600" rx="20" fill="white"/>
    </mask>
  </defs>
  
  <!-- ============================================================ -->
  <!-- ARRIERE-PLAN -->
  <!-- ============================================================ -->
  <rect width="1080" height="1350" fill="#E9F0F6"/>
  
  <!-- Texture papier subtile -->
  <rect width="1080" height="1350" fill="url(#tableauNoir)" opacity="0.03"/>
  
  <!-- ============================================================ -->
  <!-- ELEMENT PRINCIPAL : TABLEAU NOIR -->
  <!-- ============================================================ -->
  
  <!-- Fond du tableau noir avec texture -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="980" height="600" rx="20" fill="#1a1a1a" filter="url(#ombre)"/>
    
    <!-- Bordure du tableau en bois -->
    <rect x="-10" y="-10" width="1000" height="620" rx="30" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
    
    <!-- Reflets sur le tableau -->
    <rect x="20" y="20" width="940" height="560" rx="10" fill="#2a2a2a" opacity="0.3"/>
    
    <!-- Lignes du tableau (comme une ardoise) -->
    <g opacity="0.15">
      <line x1="50" y1="100" x2="930" y2="100" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="50" y1="180" x2="930" y2="180" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="50" y1="260" x2="930" y2="260" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="50" y1="340" x2="930" y2="340" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="50" y1="420" x2="930" y2="420" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="50" y1="500" x2="930" y2="500" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
    </g>
  </g>
  
  <!-- ============================================================ -->
  <!-- ACCROCHE PRINCIPALE -->
  <!-- ============================================================ -->
  
  <!-- "La confiance" - écrit à la craie blanche en haut du tableau -->
  <g transform="translate(120, 220)" filter="url(#ombreCraie)">
    <text x="0" y="0" font-family="Nunito" font-size="80" font-weight="800" fill="#ffffff" 
          letter-spacing="-2" class="nunito-bold">
      La confiance
    </text>
    <text x="0" y="90" font-family="Nunito" font-size="80" font-weight="800" fill="#ffffff" 
          letter-spacing="-2" class="nunito-bold">
      ne se devine pas
    </text>
  </g>
  
  <!-- ============================================================ -->
  <!-- IDEE VISUELLE : LES NOTES A-E COMME DES NOTES D'ECOLE -->
  <!-- ============================================================ -->
  
  <!-- Notes A-E écrites à la craie colorée sur le tableau -->
  <g transform="translate(200, 380)">
    <!-- Note A (verte) -->
    <g filter="url(#ombreCraie)">
      <text x="0" y="80" font-family="Nunito" font-size="120" font-weight="900" fill="#006837" 
            letter-spacing="-5" class="nunito-black">
        A
      </text>
      <text x="150" y="85" font-family="Nunito" font-size="35" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Excellent
      </text>
    </g>
    
    <!-- Note B (verte claire) -->
    <g transform="translate(220, 0)" filter="url(#ombreCraie)">
      <text x="0" y="80" font-family="Nunito" font-size="120" font-weight="900" fill="#8dc63f" 
            letter-spacing="-5" class="nunito-black">
        B
      </text>
      <text x="150" y="85" font-family="Nunito" font-size="35" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Bon
      </text>
    </g>
    
    <!-- Note C (orange) -->
    <g transform="translate(440, 0)" filter="url(#ombreCraie)">
      <text x="0" y="80" font-family="Nunito" font-size="120" font-weight="900" fill="#fbb03b" 
            letter-spacing="-5" class="nunito-black">
        C
      </text>
      <text x="150" y="85" font-family="Nunito" font-size="35" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Moyen
      </text>
    </g>
    
    <!-- Note D (orange foncé) -->
    <g transform="translate(600, 0)" filter="url(#ombreCraie)">
      <text x="0" y="80" font-family="Nunito" font-size="120" font-weight="900" fill="#f7931e" 
            letter-spacing="-5" class="nunito-black">
        D
      </text>
      <text x="150" y="85" font-family="Nunito" font-size="35" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Risque
      </text>
    </g>
    
    <!-- Note E (rouge) -->
    <g transform="translate(760, 0)" filter="url(#ombreCraie)">
      <text x="0" y="80" font-family="Nunito" font-size="120" font-weight="900" fill="#c1272d" 
            letter-spacing="-5" class="nunito-black">
        E
      </text>
      <text x="150" y="85" font-family="Nunito" font-size="35" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Critique
      </text>
    </g>
  </g>
  
  <!-- Ligne sous les notes -->
  <g transform="translate(200, 480)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- ============================================================ -->
  <!-- SUITE DE L'ACCROCHE -->
  <!-- ============================================================ -->
  
  <g transform="translate(120, 520)" filter="url(#ombreCraie)">
    <text x="0" y="0" font-family="Nunito" font-size="80" font-weight="800" fill="#ffffff" 
          letter-spacing="-2" class="nunito-bold">
      elle se note.
    </text>
  </g>
  
  <!-- ============================================================ -->
  <!-- LOGO TRUSTI-SCORE -->
  <!-- ============================================================ -->
  
  <!-- Cadre pour le logo -->
  <g transform="translate(780, 200)">
    <rect x="-10" y="-10" width="220" height="220" rx="15" fill="#1F3A5F" 
          stroke="#3B82C4" stroke-width="4" filter="url(#ombre)"/>
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#E9F0F6"/>
    
    <!-- Texte "Trusti-Score" dans le cadre -->
    <text x="100" y="70" font-family="Nunito" font-size="32" font-weight="800" fill="#1F3A5F" 
          text-anchor="middle" class="nunito-bold">
      Trusti
    </text>
    <text x="100" y="110" font-family="Nunito" font-size="32" font-weight="800" fill="#1F3A5F" 
          text-anchor="middle" class="nunito-bold">
      Score
    </text>
    
    <!-- Petite étoile ou symbole -->
    <text x="100" y="145" font-family="Nunito" font-size="24" font-weight="700" fill="#3B82C4" 
          text-anchor="middle" class="nunito-bold">
      ★
    </text>
  </g>
  
  <!-- ============================================================ -->
  <!-- EXPLICATION COURTE -->
  <!-- ============================================================ -->
  
  <!-- Fond pour la section d'explication -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="980" height="200" rx="15" fill="#ffffff" 
          stroke="#1F3A5F" stroke-width="2" filter="url(#ombre)"/>
    
    <!-- Texte explicatif -->
    <g transform="translate(50, 30)">
      <text x="0" y="0" font-family="Nunito" font-size="36" font-weight="700" fill="#1F3A5F" 
            class="nunito-bold">
        Évaluez la souveraineté numérique de vos applications
      </text>
      <text x="0" y="50" font-family="Nunito" font-size="24" fill="#1B2A3A" 
            class="nunito">
        Notes A à E basées sur 5 critères : localisation des données, gouvernance,
      </text>
      <text x="0" y="80" font-family="Nunito" font-size="24" fill="#1B2A3A" 
            class="nunito">
        contrôle technique, conformité RGPD, transparence
      </text>
    </g>
  </g>
  
  <!-- ============================================================ -->
  <!-- INVITATION A DECOUVRIR + URL -->
  <!-- ============================================================ -->
  
  <!-- Fond pour la section d'invitation -->
  <g transform="translate(50, 1000)">
    <rect x="0" y="0" width="980" height="150" rx="15" fill="#1F3A5F" 
          filter="url(#ombre)"/>
    
    <!-- Texte d'invitation -->
    <g transform="translate(50, 30)">
      <text x="0" y="0" font-family="Nunito" font-size="32" font-weight="700" fill="#ffffff" 
            class="nunito-bold">
        Découvrez Trusti-Score dès maintenant
      </text>
      
      <!-- URL -->
      <text x="0" y="60" font-family="Nunito" font-size="28" font-weight="600" fill="#3B82C4" 
            class="nunito-bold">
        https://trusti-score.lielu.eu/
      </text>
    </g>
  </g>
  
  <!-- ============================================================ -->
  <!-- ELEMENTS DECORATIFS -->
  <!-- ============================================================ -->
  
  <!-- Craies colorées en bas à gauche -->
  <g transform="translate(100, 1200)">
    <!-- Craie verte (A) -->
    <rect x="0" y="0" width="20" height="180" rx="10" fill="#006837" transform="rotate(-10 10 90)" 
          filter="url(#ombreCraie)"/>
    <rect x="5" y="5" width="10" height="170" rx="5" fill="#008040"/>
    
    <!-- Craie verte claire (B) -->
    <rect x="30" y="0" width="20" height="180" rx="10" fill="#8dc63f" transform="rotate(-5 40 90)" 
          filter="url(#ombreCraie)"/>
    <rect x="35" y="5" width="10" height="170" rx="5" fill="#a0d050"/>
    
    <!-- Craie orange (C) -->
    <rect x="60" y="0" width="20" height="180" rx="10" fill="#fbb03b" transform="rotate(5 70 90)" 
          filter="url(#ombreCraie)"/>
    <rect x="65" y="5" width="10" height="170" rx="5" fill="#ffc040"/>
    
    <!-- Craie orange foncé (D) -->
    <rect x="90" y="0" width="20" height="180" rx="10" fill="#f7931e" transform="rotate(10 100 90)" 
          filter="url(#ombreCraie)"/>
    <rect x="95" y="5" width="10" height="170" rx="5" fill="#ffa030"/>
    
    <!-- Craie rouge (E) -->
    <rect x="120" y="0" width="20" height="180" rx="10" fill="#c1272d" transform="rotate(15 130 90)" 
          filter="url(#ombreCraie)"/>
    <rect x="125" y="5" width="10" height="170" rx="5" fill="#e03030"/>
  </g>
  
  <!-- ============================================================ -->
  <!-- BORDURE DE L'AFFICHE -->
  <!-- ============================================================ -->
  
  <!-- Bordure fine autour de toute l'affiche -->
  <rect x="20" y="20" width="1040" height="1310" rx="10" fill="none" 
        stroke="#1F3A5F" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- ============================================================ -->
  <!-- METADONNEES -->
  <!-- ============================================================ -->
  
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description about="#affiche-trusti-score">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Affiche Trusti-Score - La confiance ne se devine pas, elle se note.</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Affiche publicitaire pour Trusti-Score, projet communautaire d'évaluation de la souveraineté numérique des applications.
          Concept : tableau noir avec notes A-E à la craie, évoquant la notation scolaire.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Vibe Code - Mistral AI</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024-10-19</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  
  <!-- ============================================================ -->
  <!-- TEXTE ALTERNATIF POUR ACCESSIBILITE -->
  <!-- ============================================================ -->
  <title>Affiche Trusti-Score</title>
  <desc>
    Affiche publicitaire pour Trusti-Score.
    Accroche : "La confiance ne se devine pas, elle se note."
    Visuel : Tableau noir avec les notes A, B, C, D, E écrites à la craie colorée.
    Message : Évaluez la souveraineté numérique de vos applications.
    URL : https://trusti-score.lielu.eu/
  </desc>
</svg>
