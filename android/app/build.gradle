apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Version : versionCode ET tag de release doivent croître à chaque build CI, sinon Android refuse
// la mise à jour / la bibliothèque ne la voit pas (un tag « v1.0-25 » serait une pré-version < 1.0).
// BUILD_NUMBER = github.run_number en CI ; 1 en local.
def buildNumber = (System.getenv('BUILD_NUMBER') ?: project.findProperty('buildNumber'))?.toString()?.toInteger() ?: 1
def appVersionBase = project.property('appVersionBase')

// Clé d'upload Play Store fournie par la CI depuis les secrets du dépôt.
// Absente en local : Gradle retombe sur la signature debug (même logique que
// swipernews, voir play-store-bundle.yml).
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseKeystore = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace = "eu.trusti.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "eu.trusti.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Même applicationId et même clé de signature pour tous les APK des releases GitHub.
        versionCode buildNumber
        versionName "$appVersionBase.$buildNumber"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé debug FIXE, committée dans le repo (android/debug.keystore).
    // Sans ça, chaque runner CI neuf régénère sa propre clé debug aléatoire
    // (~/.android/debug.keystore n'existe pas encore) : deux builds
    // successifs sont alors signés différemment, et Android refuse
    // d'installer la mise à jour par-dessus l'ancienne ("app non installée")
    // tant qu'on n'a pas désinstallé à la main. Une clé debug n'a rien de
    // secret (mot de passe "android" documenté par Google) — la committer
    // est la pratique standard pour des builds CI reproductibles.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Les APK des releases GitHub sont des builds debug : mises à jour automatiques actives.
            buildConfigField "boolean", "UPDATER_ENABLED", "true"
        }
        release {
            // Build Play Store (AAB) : pas d'auto-mise à jour (src/release/AndroidManifest.xml retire
            // aussi REQUEST_INSTALL_PACKAGES, restreinte par Google Play).
            buildConfigField "boolean", "UPDATER_ENABLED", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

// play-store-bundle.yml surcharge la version par -P, sans jamais toucher au
// littéral ci-dessus — même principe que trustiVersionCode/trustiVersionName
// pour android.yml.
if (project.hasProperty('versionCode')) {
    android.defaultConfig.versionCode = project.property('versionCode') as Integer
}
if (project.hasProperty('versionName')) {
    android.defaultConfig.versionName = project.property('versionName')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.lielu:lielugit-updater:1.0.0"
    // Fenêtre de mise à jour en Compose (par-dessus la WebView Capacitor).
    implementation platform("androidx.compose:compose-bom:2025.10.01")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
