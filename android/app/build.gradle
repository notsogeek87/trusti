apply plugin: 'com.android.application'

// Clé d'upload Play Store fournie par la CI depuis les secrets du dépôt.
// Absente en local : Gradle retombe sur la signature debug (même logique que
// swipernews, voir play-store-bundle.yml).
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseKeystore = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace = "com.trusti.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trusti.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Surchargeable en CI via -PtrustiVersionCode=N -PtrustiVersionName=X.Y.N
        // pour que chaque release GitHub porte une version unique et croissante.
        versionCode project.hasProperty('trustiVersionCode') ? (trustiVersionCode as int) : 1
        versionName project.hasProperty('trustiVersionName') ? trustiVersionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé debug FIXE, committée dans le repo (android/debug.keystore).
    // Sans ça, chaque runner CI neuf régénère sa propre clé debug aléatoire
    // (~/.android/debug.keystore n'existe pas encore) : deux builds
    // successifs sont alors signés différemment, et Android refuse
    // d'installer la mise à jour par-dessus l'ancienne ("app non installée")
    // tant qu'on n'a pas désinstallé à la main. Une clé debug n'a rien de
    // secret (mot de passe "android" documenté par Google) — la committer
    // est la pratique standard pour des builds CI reproductibles.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// play-store-bundle.yml surcharge la version par -P, sans jamais toucher au
// littéral ci-dessus — même principe que trustiVersionCode/trustiVersionName
// pour android.yml.
if (project.hasProperty('versionCode')) {
    android.defaultConfig.versionCode = project.property('versionCode') as Integer
}
if (project.hasProperty('versionName')) {
    android.defaultConfig.versionName = project.property('versionName')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
